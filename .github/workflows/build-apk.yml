name: Build template APK

on:
  workflow_dispatch:   # tombol "Run workflow" manual di tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle to Android SDK yang sudah ada di runner
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate Gradle wrapper (kunci versi 8.7 — cocok dengan AGP 8.2.0)
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: template-apk
          path: app/build/outputs/apk/debug/app-debug.apk
